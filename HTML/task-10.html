<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task 10: Hotel Reservation Form</title>
  </head>
  <body>
    <h1>Task 10: Hotel Reservation</h1>
    <p>
      This is a real-world example of a booking system. It uses date pickers,
      number inputs, and fieldsets to organize a reservation request.
    </p>

    <form action="#">
      <fieldset>
        <legend>Guest Information</legend>
        <div>
          <label for="guest-name">Full Name:</label>
          <input type="text" id="guest-name" name="guest-name" required />
        </div>
        <br />
        <div>
          <label for="guest-email">Email:</label>
          <input type="email" id="guest-email" name="guest-email" required />
        </div>
      </fieldset>
      <br />

      <fieldset>
        <legend>Stay Details</legend>
        <div>
          <label for="check-in">Check-in Date:</label>
          <input type="date" id="check-in" name="check-in" required />
        </div>
        <br />
        <div>
          <label for="check-out">Check-out Date:</label>
          <input type="date" id="check-out" name="check-out" required />
        </div>
        <br />
        <div>
          <label for="guests">Number of Guests (1-4):</label>
          <input
            type="number"
            id="guests"
            name="guests"
            min="1"
            max="4"
            value="2"
          />
        </div>
        <br />
        <div>
          <label for="room-type">Room Type:</label>
          <select id="room-type" name="room-type">
            <option value="standard">Standard</option>
            <option value="deluxe">Deluxe</option>
            <option value="suite">Suite</option>
          </select>
        </div>
      </fieldset>
      <br />

      <div>
        <label for="special-requests">Special Requests:</label><br />
        <textarea
          id="special-requests"
          name="special-requests"
          rows="4"
          cols="50"
          placeholder="e.g., late check-in, extra pillows..."
        ></textarea>
      </div>
      <br />

      <div>
        <button type="reset">Clear Booking</button>
        <button type="submit">Confirm Reservation</button>
      </div>
    </form>
  </body>
</html>
